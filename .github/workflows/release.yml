name: Build & Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
          - os: windows-latest
            label: windows-x64
          - os: macos-latest
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build standalone executable & portable archive
        shell: bash
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          python package.py --version "$VERSION"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os != 'ubuntu-latest'
        with:
          files: |
            dist/SYNAPSE-TW-*-windows-*.exe
            dist/SYNAPSE-TW-*-macos-*

      - name: Upload Linux Binary & Portable Archives
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'ubuntu-latest'
        with:
          files: |
            dist/SYNAPSE-TW-*-linux-*
            dist/SYNAPSE-TW-*-portable.zip
            dist/SYNAPSE-TW-*-portable.tar.gz

  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Stage Web & PWA assets into Android APK
        shell: bash
        run: |
          mkdir -p mobile/android/app/src/main/assets/icons
          cp index.html mobile/android/app/src/main/assets/index.html
          cp manifest.webmanifest mobile/android/app/src/main/assets/manifest.webmanifest
          cp sw.js mobile/android/app/src/main/assets/sw.js
          cp -r icons/* mobile/android/app/src/main/assets/icons/

      - name: Build installable Android APK
        working-directory: mobile/android
        run: gradle assembleRelease --no-daemon

      - name: Package & Upload Android APK Asset
        shell: bash
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          mkdir -p dist
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "dist/SYNAPSE-TW-${VERSION}-android.apk"
          ls -lh "dist/SYNAPSE-TW-${VERSION}-android.apk"

      - name: Upload Android APK to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/SYNAPSE-TW-*-android.apk

  build-ios-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Stage Web & PWA assets into iOS Bundle
        shell: bash
        run: |
          mkdir -p mobile/ios/SynapseTW/WebAssets/icons
          cp index.html mobile/ios/SynapseTW/WebAssets/index.html
          cp manifest.webmanifest mobile/ios/SynapseTW/WebAssets/manifest.webmanifest
          cp sw.js mobile/ios/SynapseTW/WebAssets/sw.js
          cp -r icons/* mobile/ios/SynapseTW/WebAssets/icons/

      - name: Generate Xcode Project & Build Native iOS App (.ipa)
        working-directory: mobile/ios
        shell: bash
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          xcodegen generate
          xcodebuild \
            -project SynapseTW.xcodeproj \
            -scheme SynapseTW \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          mkdir -p build/ipa/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/SynapseTW.app build/ipa/Payload/
          mkdir -p ../../dist
          (cd build/ipa && zip -qr "../../../../dist/SYNAPSE-TW-${VERSION}-ios-unsigned.ipa" Payload)
          ls -lh "../../dist/SYNAPSE-TW-${VERSION}-ios-unsigned.ipa"

      - name: Upload iOS IPA to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/SYNAPSE-TW-*-ios-unsigned.ipa
