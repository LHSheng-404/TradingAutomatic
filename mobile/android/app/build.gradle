plugins {
    id 'com.android.application'
}

android {
    namespace 'com.synapsetw.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.synapsetw.app"
        minSdk 24
        targetSdk 34
        versionCode 3106
        versionName "3.10.6"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
